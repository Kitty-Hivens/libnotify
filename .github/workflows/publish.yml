name: Publish

# A release is cut from a tag: tag vX.Y.Z, push it, and this signs the
# artifacts and uploads them to Maven Central. The version comes from the tag,
# not from gradle.properties -- the appVersion there is a SNAPSHOT placeholder
# for local builds and would publish nonsense coordinates. The job runs in the
# maven-central environment, so the credentials sit behind that environment's
# approval rather than firing on any pushed tag.
on:
  push:
    tags: [ "v*", "[0-9]*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.2. Run it from that version's tag. Ignored by a dry run."
        required: false
      dry_run:
        description: "Build, test and sign with the CI key, publish nowhere. Runs from any ref."
        type: boolean
        default: false

env:
  JAVA_VERSION: '22'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    # Pinned to commits, not tags: this job holds the signing key and the
    # Central token, and a tag can be moved to code nobody reviewed. Dependabot
    # updates the pins and the version comments together.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Resolve the version
        id: version
        env:
          # A dispatched run is where "v0.1.2" gets pasted in by hand; the tag
          # path has already stripped the v.
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A dry run ships nothing, so it needs no tag and no real version.
          if [ "$DRY_RUN" = "true" ]; then
            echo "v=0.0.0-signing-check" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a tag ships, whichever way the run started: a dispatch from a
          # branch would publish code no tag records.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::publish runs from a tag, this run is on $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
            if [ "$v" != "${GITHUB_REF_NAME#v}" ]; then
              echo "::error::version '$v' does not match the tag '$GITHUB_REF_NAME' this run is on"
              exit 1
            fi
          fi
          case "$v" in
            [0-9]*) ;;
            *) echo "::error::version '$v' does not start with a digit"; exit 1 ;;
          esac
          case "$v" in
            *[!0-9A-Za-z.-]*) echo "::error::version '$v' has characters a version does not"; exit 1 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # Central versions are immutable, and a reused one is rejected only at
      # the end of the upload -- after everything has been built and signed.
      - name: Guard the version
        if: ${{ inputs.dry_run != true }}
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          v="$VERSION"
          if curl -fsI -o /dev/null "https://repo1.maven.org/maven2/dev/hivens/libnotify/$v/libnotify-$v.pom"; then
            echo "::error::dev.hivens:libnotify:$v is already on Central -- versions are immutable"
            exit 1
          fi
          echo "publishing $v"

      # The integration suite starts its own private bus.
      - name: Install dbus-daemon
        run: command -v dbus-daemon || (sudo apt-get update && sudo apt-get install -y dbus)

      # The tag is what ships, so it is tested here rather than on the trust
      # that main was green when it was cut.
      - name: Build + test
        run: ./gradlew build --stacktrace

      # The signing path a release takes, short of the upload: the in-memory
      # key reaches the build exactly as it does on a tag, and the signatures
      # land in the runner's local repository. Only the signing secrets are
      # handed over, the Central token stays out of a run that uploads nothing.
      - name: Sign without publishing
        if: ${{ inputs.dry_run == true }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          ./gradlew publishToMavenLocal \
            -PappVersion="$VERSION" \
            --no-configuration-cache
          dir="$HOME/.m2/repository/dev/hivens/libnotify/$VERSION"
          ls -l "$dir"
          for f in "$dir"/*.jar "$dir"/*.pom "$dir"/*.module; do
            if [ ! -s "$f.asc" ]; then
              echo "::error::no signature for $(basename "$f")"
              exit 1
            fi
          done
          # Which key signed, read off the signature packet: needs no key at all.
          gpg --list-packets "$dir/libnotify-$VERSION.pom.asc" | grep -iE 'signature packet|keyid'

      - name: Publish
        if: ${{ inputs.dry_run != true }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          # The in-memory key is what makes the build skip useGpgCmd; the
          # configuration cache is on in gradle.properties and the publish
          # tasks do not survive it.
          ./gradlew publishToMavenCentral \
            -PappVersion="$VERSION" \
            --no-configuration-cache
